function b64(b){return btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")}
async function auth(){let v=rnd(96),st=rnd(32);sessionStorage.v=v;sessionStorage.st=st;let ch=b64(await sha(v));let p=new URLSearchParams({response_type:"code",client_id:CLIENT_ID,scope:"playlist-modify-private",redirect_uri:REDIRECT_URI,state:st,code_challenge_method:"S256",code_challenge:ch});location.href="https://accounts.spotify.com/authorize?"+p}
async function api(token,url,opt={}){let h=Object.assign({Authorization:"Bearer "+token},opt.headers||{});let r=await fetch(url,Object.assign({},opt,{headers:h}));if(!r.ok)throw Error(r.status+" "+await r.text());return r.status===204?null:r.json()}
async function token(code){let b=new URLSearchParams({grant_type:"authorization_code",code,redirect_uri:REDIRECT_URI,client_id:CLIENT_ID,code_verifier:sessionStorage.v});let r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:b});if(!r.ok)throw Error(await r.text());return(await r.json()).access_token}
async function search(t,a){let p=new URLSearchParams({q:`track:"${t}" artist:"${a}"`,type:"track",limit:"10",market:"ID"});let d=await api(T,"https://api.spotify.com/v1/search?"+p),x=d.tracks.items;if(!x.length)return null;let n=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,""),na=n(a),nt=n(t);function score(i){let sa=n(i.artists.map(x=>x.name).join(" ")),st=n(i.name);return(sa.includes(na)||na.includes(sa)?5:0)+(st===nt?5:(st.includes(nt)||nt.includes(st)?3:0))}return x.sort((u,v)=>score(v)-score(u))[0]}
async function run(){document.querySelector("#go").disabled=true;let q=new URLSearchParams(location.search);if(!q.get("code"))return auth();try{if(q.get("state")!==sessionStorage.st)throw Error("Authorization state mismatch.");T=await token(q.get("code"));history.replaceState({},"",location.pathname);log("Connected. Searching "+TRACKS.length+" tracks…");let u=[],m=[];for(let i=0;i<TRACKS.length;i++){let t=TRACKS[i],x=await search(t.title,t.artist);if(x){u.push(x.uri);log("✓ "+(i+1)+"/"+TRACKS.length+" "+x.artists[0].name+" — "+x.name)}else{m.push(t);log("✗ "+(i+1)+"/"+TRACKS.length+" "+t.artist+" — "+t.title)}await new Promise(r=>setTimeout(r,70))}let p=await api(T,"https://api.spotify.com/v1/me/playlists",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:"NOVA SOCIAL — CLARIFICATION",description:"Nova Social Tuesday playlist: dream pop, atmospheric pop and ethereal electronic textures for spacious clarity. 09:00–23:00 extended sequence.",public:false,collaborative:false})});for(let i=0;i<u.length;i+=100)await api(T,"https://api.spotify.com/v1/playlists/"+p.id+"/items",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({uris:u.slice(i,i+100)})});log("\nDONE 🎉\nAdded: "+u.length+" tracks\nNot found: "+m.length+"\n\n"+p.external_urls.spotify);let a=document.createElement("a");a.href=p.external_urls.spotify;a.target="_blank";a.textContent="Open playlist in Spotify";a.style.color="#1db954";a.style.display="block";a.style.marginTop="16px";document.querySelector("#log").appendChild(a)}catch(e){log("\nERROR: "+e.message);document.querySelector("#go").disabled=false}}
let T;document.querySelector("#go").onclick=run;run();
</script></body></html>
